# =============================================================================
# netclip 配置示例
#
# 用法：
#   1. 把本文件复制为 config.toml，两台机器各放一份；
#   2. 两边都填好 peer_ip（对方的 IP）；
#   3. 两边都设一个相同的 security.psk；
#   4. 按实际摆放关系改 layout.peer_position。
#
# 最小配置只需要三个字段：network.peer_ip、security.psk、device.name（可留空）。
# 其余全有默认值，可以整段删掉。
# =============================================================================

[device]
# 本机标识，用于握手时告诉对端"我是谁"。留空则自动取计算机名。
name = "desktop-a"


# -----------------------------------------------------------------------------
# 网络
# -----------------------------------------------------------------------------
[network]
# 本机监听地址。0.0.0.0 表示所有网卡；想只走某块网卡可以填 "192.168.1.10"。
listen_host = "0.0.0.0"

# 输入通道端口（鼠标/键盘，低延迟，最高优先级）。
# 剪贴板通道 = listen_port+1，文件通道 = listen_port+2，会自动推导。
listen_port = 24800

# ★ 互联 IP：对端的地址。填 IP，也可以填对方计算机名（需内网能解析）。
peer_ip = "192.168.1.42"

# 对端输入通道端口。两台机器配置一致时不用改。
peer_port = 24800

# 关闭 Nagle 算法。我们的帧本身就是批量发的，攒包只会增加延迟。
nodelay = true

# 输入通道发送队列上限。满了会丢"最旧的鼠标移动"（位移会累加进新事件，不丢精度），
# 键盘和鼠标按键永不丢弃。
input_queue_max = 256

# 鼠标移动合并窗口（毫秒）。约 8ms ≈ 125Hz 上报，人手完全感知不到。
# 网络差的时候可以调大（如 16），代价是鼠标略"糊"。
move_coalesce_ms = 8

# 心跳与超时。timeout_sec 必须大于 heartbeat_sec。
heartbeat_sec = 2
timeout_sec = 6

# 断线后重连间隔。
reconnect_interval_sec = 3
connect_timeout_sec = 5

# TCP keepalive。注意 Windows 默认要 2 小时才发第一个探测包，所以断线判定
# 实际依赖上面的应用层心跳，这一项只是补充。
tcp_keepalive = true

# 断线时是否强制把光标拉回本机（强烈建议 true，否则光标会"留"在对端）。
recapture_on_disconnect = true


# -----------------------------------------------------------------------------
# 屏幕摆放关系  ★ 决定鼠标从哪条边出去、从哪条边进来
# -----------------------------------------------------------------------------
[layout]
# ★★ 对端相对**本机**的位置：right / left / up / down
#   right = 对端在本机右边（光标从本机右边缘出去）
#   up    = 对端在本机上方（光标从上边缘出去）
#
# !!!! 两台机器必须填**相反**的值 !!!!
#   这个键问的是"对端在我哪一侧"。两台机器互为对方的对端，所以：
#       对端在右的那台填 "right"  ->  另一台必须填 "left"
#   两边填成一样（很自然的误解："两台机器的摆放关系"听起来像共享设置）
#   会让两边几何互相矛盾，光标被摆到对端错误的那条边上 ——
#   表现为鼠标被钉在边缘、推不动、来回弹。
#   真机上就踩到了这个坑，所以 netclip 在握手时会对两边填一样的值**直接报错**。
peer_position = "right"

# 本机屏幕 [x, y, 宽, 高]。留空或整行删掉则运行时自动探测主屏。
# 多显示器时 x/y 用 Windows 虚拟桌面坐标（可能为负）。
# local_screen = [0, 0, 1920, 1080]

# 对端屏幕分辨率，握手时会自动用对端上报的真实值覆盖；
# 这里只是对端还没连上时的兜底。
peer_screen = [0, 0, 1920, 1080]

# 边缘判定带宽（像素）。光标进入离边缘这个距离内，才被认作"想出去"。
# 太小会导致难以触发，太大会导致贴着边操作时误穿越。1~4 比较合适。
edge_band_px = 2

# 穿越后把本机光标从边缘拉回的像素数。必须是正数，否则光标停在边缘会反复穿越。
warp_inset_px = 8

# 两次穿越之间的冷却时间。
#
# 它不只是"防抖"，还是**两端抢控制权的仲裁窗口**：刚让出控制权的一方在
# 这段时间内不接受对端的接管请求。设得太小会退化成两端互相把光标拽回来
# （现象：鼠标像被弹簧拉住，挪走一点就被拉回去）。
switch_cooldown_ms = 500

# 穿越后多久不判"反向穿越"，防抖用。
arm_delay_ms = 600


# -----------------------------------------------------------------------------
# 鼠标/键盘共享
# -----------------------------------------------------------------------------
[input]
share_mouse = true
share_keyboard = true

# 是否转发音量/播放等媒体键。默认 false，避免误触对端的播放器。
forward_media_keys = false

# 输入后端。auto = 有编译好的 netclip_native.dll 就用它，否则用纯 Python 实现。
# python = 强制用纯 Python（便于排查）；native = 强制用 DLL（缺失则报错）。
backend = "auto"

# 这些组合键**永不转发**，永远在本机生效。防止把自己锁在对端、
# 或者把 Ctrl+Alt+Del 这类安全注意序列误发过去。
#
# ★★ 只放"两个以上修饰键"的组合 ★★
#   拦截策略是"整段拦下"：某个组合的修饰键一齐全就进入拦截段，直到修饰键全部
#   松开为止，中间所有按键都不转发。所以 `win+l` / `alt+tab` 这类
#   **"单个修饰键 + 主键"的组合，会把那个修饰键本身也吞掉** ——
#   配了 `win+l` 之后 Win 键完全传不到对端（Win+E / Win+D / Win+方向全废），
#   `alt+tab` 同理吞掉 Alt。真机上用户报的就是"Win 键不能映射"。
#   要保住本机组合请用两个以上修饰键；逃生另有 hotkey_recapture。
local_hotkeys = [
    "ctrl+alt+del",
    "ctrl+shift+esc",
]

# 紧急快捷键：把光标强制拉回本机 / 临时暂停或恢复共享。
hotkey_recapture = "ctrl+alt+home"
hotkey_toggle = "ctrl+alt+pause"

# 排查"键盘没传到对端"时看看日志：每条被拦下的按键都会打出原因
# （当前处于 LOCAL / share_keyboard 关了 / 被本机热键拦了）。

# 排查"键盘没传到对端"时把它设成 10：启动后前 10 次被拦下的按键会打日志，
# 直接告诉你原因（当前是 LOCAL / share_keyboard 关了 / 被本机热键拦了）。
# 正常情况下保持 0，避免刷日志。
debug_keys = 0


# -----------------------------------------------------------------------------
# 剪贴板
# -----------------------------------------------------------------------------
[clipboard]
enable = true

# 同步哪些类别。文件走独立的文件通道。
sync_text = true
sync_rtf = true
sync_html = true
sync_image = true
sync_files = true

# 变更合并窗口（毫秒）。有些程序复制的瞬间会连写好几次剪贴板，
# 用这个把连续的变更合并成一次发送。
debounce_ms = 120

# 单次剪贴板内容总上限（MB）。超过则整条不同步，并提示。
max_payload_mb = 50

# 写对端剪贴板时 OpenClipboard 抢不到锁的重试退避（毫秒）。
# 总窗口约 0.6s，失败就放弃这一次，**绝不长时间占用剪贴板**——
# 这是避免"其它程序无法写入剪贴板"的关键。
open_retry_ms = [20, 40, 80, 160, 320]


# ---- 剪贴板里的文件 --------------------------------------------------------
[clipboard.files]
# ★ 同步文件阈值（MB）。
#   <= 阈值：直接流式传输文件内容，传完在接收端落盘并放进剪贴板，
#            对方粘贴就是本地文件（像 Mouse Without Borders 那样）。
#   >  阈值：按下面的 over_threshold_action 处理。
auto_transfer_max_mb = 200

# 超过阈值时的行为：
#   "ask"      = 弹通知问是否同步（推荐）
#   "skip"     = 不同步，只提示
#   "transfer" = 照传不误（慎用，可能传很久）
over_threshold_action = "ask"

# 收到的文件怎么交付：folder | clipboard
#
#   "folder"（默认）—— 直接存到 receive_dir，**完全不经过剪贴板**。
#       收完提示"文件已存到 …"，用户自己去目录里拿。这条路径不依赖资源管理器的
#       粘贴实现，也就没有任何可崩的地方。
#   "clipboard" —— 落盘到暂存区后把 `CF_HDROP` 放回剪贴板，对端可以直接 Ctrl+V。
#       代价：跨机复制文件在剪贴板层面牵扯很多（Shell IDList Array 的 CIDA 结构、
#       拖放簿记格式、定长结构被截断），真机上两次把资源管理器搞崩（卡住重启）。
#       除非你确实需要直接粘贴，否则别开。
deliver = "folder"

# 接收目录：deliver = "folder" 时文件平铺放在这里。
# 留空 = %USERPROFILE%\Downloads\netclip（特意放在用户找得到的地方）。
receive_dir = ""

# 暂存目录的保留时长（分钟）。只在 deliver = "clipboard" 时有意义：
# CF_HDROP 是引用式的，剪贴板里放的是路径，文件必须真实存在一段时间。
staging_ttl_min = 120

# 文件分块大小（KB）。
chunk_size_kb = 1024

# 是否做 SHA-256 校验（大文件会多花一点 CPU，建议开启）。
verify_sha256 = true


# ---- 剪贴板格式（Office / MathType 保真的关键）------------------------------
[clipboard.formats]
# ★ 全格式转发。开启后，PPT 形状、MathType 公式、Excel 区域等
#   私有格式会连同样式一起搬过去，对端粘贴才是"可编辑对象"而不是死图。
forward_all = true

# 排除的格式名（正则）。
#
# ★ 这两个是**实测出来**的，别随手改：
#   * `Ole Private Data` **必须丢** —— 它装的是源进程里那个 OLE 数据对象的封送引用，
#     搬到对端是悬空引用。对端 OLE 一看到就尝试反封送、失败，于是整个剪贴板对 OLE
#     客户端都是坏的，WPS 只能退回图片。
#   * `Link Source` 系列**绝不能排除** —— 少了它们对端 OLE 连可用的东西都没有，
#     粘贴菜单直接变灰（连图片都粘不了）。
#
#   三组真机 A/B（同一个剪贴板，两台各跑一次 tools/clip_probe.py）：
#
#     排除                                     接收端格式数  结果
#     DataObject + Ole Private Data + Link Source*   13     菜单灰，完全粘不了
#     一条不排                                        18     能粘，但退成图片
#     DataObject + Ole Private Data（本默认）         16     能粘，可编辑对象
#
#   UU远程（GameViewer.exe）的行为就是最后一组：它收到的 16 种格式里，除了这两个
#   之外其余全部逐字节一致，而且枚举顺序和源端完全一致。
exclude = [
    "^DataObject$",
    "^Ole Private Data$",
]

# ★ **按"复制来源进程"切换丢弃列表。**
#
# 为什么需要它：同一个 `Ole Private Data` 在不同程序上要求**相反**，静态 `exclude`
# 无论怎么配都只能满足一边。真机把 3 条排除的正则**枚举了 8 种组合**，结论是：
#
#   | Ole Private Data | PPT（wpp.exe） | Word（winword.exe） |
#   |---|---|---|
#   | 排掉 | **可编辑** ✅ | **粘不了** ❌ |
#   | 原样转发 | **退成图片** ❌ | **可以** ✅ |
#
# 去掉 `DataObject` / `Link Source.*` 怎么组合都不影响这个结论（都试过）。
#
# 机制：`Ole Private Data` 装的是**源进程里那个 OLE 数据对象的封送引用**，
# 跨机搬过去就是悬空引用。PPT 走 OLE 粘贴，反封送失败就退回图片；
# 而 Word 的文字粘贴需要剪贴板上有 OLE 数据对象的身份，没有就粘不了。
# 只有"接收端 OLE 自己生成一份本机有效的"才能两边都好 —— 原生复制和 UU远程 是那一档，
# 我们做不到（裸 `SetClipboardData` 不会生成它）。
#
# 判据用**进程名**（剪贴板所有者）而不是猜格式 —— 那是直接可观测的。
# 匹配不到就走上面的 `exclude`。进程名按小写、精确匹配文件名。
exclude_by_process = [
    # WPS 演示：排掉它，形状/文本框/表格才能粘成可编辑对象
    { process = "wpp.exe", exclude = ["^Ole Private Data$"] },
    # 微软 PowerPoint：按同一机制推断，没单独验过
    { process = "powerpnt.exe", exclude = ["^Ole Private Data$"] },
    # Word：留着他，文字才粘得了
    { process = "winword.exe", exclude = [] },
]

# 单个格式的负载上限（MB）。超过则**丢弃这一个格式**，其它格式继续同步。
# 例如 CF_DIB 特别大时，仍然保留 HTML/RTF/私有格式。
per_format_max_mb = 100

# 传输前 zlib 压缩。DIB 和 HTML 的压缩率通常不错。
compress = true

# 把 HTML Format 里的 file:/// 本地图片引用内联成 data: URI。
# 不开启的话，Excel/PPT 复制过来的图片到对端会变成空占位符。
#
# ★ 注意：这是整条链路上**唯一一处主动改写内容**的地方（其它格式都是原样字节转发）。
#   真机 A/B 已经确认它**不是**"公式粘成图片"的原因（关掉它照样是图片），
#   而它当初的存在理由**没有实测记录支撑**。要不要默认开，等粘贴问题定了再单独决定。
inline_html_refs = true

# ★ 实验开关，**默认关**：写完对端剪贴板后让 OLE 正式接管
#   （`OleGetClipboard` -> `OleSetClipboard` -> `OleFlushClipboard`），
#   由 OLE 生成属于**本机**的数据对象身份，而不是把源机器的封送引用原样搬过去。
#
#   动机：裸 `SetClipboardData` 写出来的剪贴板没有 OLE 数据对象的身份，而 Office/WPS
#   的粘贴走 `OleGetClipboard`；对照组 UU远程 送来的同一份内容对端粘出来是**可编辑对象**，
#   它的剪贴板有所有者窗口。
#
#   现状：**本机实测不成功** —— `OleSetClipboard` 报 `CLIPBRD_E_CANT_CLOSE`，而且
#   会把剪贴板清空（接管后只剩 `DataObject`）。所以代码里带了"格式变少就回滚"的自检，
#   但在真机上证明有用之前不默认打开。
ole_finish = false

# 允许同步的私有格式名白名单（正则）。留空 = 不加额外限制。
# 调试期可以只填 ["^PowerPoint", "^MathType"] 收窄范围。
allow_private = []

# 还原剪贴板时的写入顺序。Windows 上 CF_EMBEDDEDOBJECT 必须最后写，
# 前面的顺序影响 Office 能否认成"可编辑对象"。一般不用改。
paste_priority = [
    "PowerPoint 12.0 Shape",
    "MathType 5.0 Equations",
    "Equation Native",
    "PNG",
    "HTML Format",
    "Rich Text Format",
    "image/bmp",
    "CF_ENHMETAFILE",
    "CF_DIBV5",
    "CF_DIB",
    "CF_UNICODETEXT",
]


# -----------------------------------------------------------------------------
# 界面
# -----------------------------------------------------------------------------
[ui]
# 系统托盘图标（暂停/恢复、强制回拉、查看状态）。
tray = true

# 是否弹系统通知（大文件传输、降级提示等）。
notify = true


# -----------------------------------------------------------------------------
# 安全
# -----------------------------------------------------------------------------
[security]
# ★ 预共享密钥，两台机器必须一致。用于握手时 HMAC 校验，防止连错机器。
# 这不是加密：局域网内内容是明文传输的。家里/公司内网够用。
psk = "change-me-please"


# -----------------------------------------------------------------------------
# 日志
# -----------------------------------------------------------------------------
[logging]
level = "INFO"
file = "netclip.log"
max_mb = 2
backups = 3


# -----------------------------------------------------------------------------
# 调试开关
# -----------------------------------------------------------------------------
# 这里原先有一个 [debug] 段（鼠标追踪 CSV、每秒输入诊断、整条链路的逐条日志）。
# 那三个模块在精简时被删掉了，**这个段现在不再被读取** —— 段名留着只是为了
# 不让已经写过 [debug] 的旧配置直接报"未知的配置段"。
#
# 要排查输入 / 鼠标问题，用这些自检（见 README 的"自检工具"）：
#   python -m netclip.selftest loop --seconds 10   # 连通性，但不转发输入（最安全）
#   python -m netclip.selftest warpguard           # "鼠标被吸住高频抖动、推不动"
#   python -m netclip.selftest inject              # 注入有没有被误判成本机输入
#   python -m netclip.selftest keys --seconds 8    # 每个键的原始 vk / 扫描码
#   python -m netclip.selftest hooks --seconds 5   # 钩子装了没、回调耗时
#
# 按键级别的诊断在 [input] 段的 debug_keys（那个**仍然有效**）。
